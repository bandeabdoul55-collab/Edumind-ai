<style>
:root{--bg:#F2F5FC;--ink:#0B1B4D;--mut:#4A5578;--card:#fff;--acc:#1D4ED8;--onacc:#fff;--accbg:#DCE7FF;--accink:#1E3A8A;--line:#D5DDF2;--badbg:#FDE4DE;--badink:#9A2A10;--gold:#FBBF24;--ongold:#1B1B1B;--mind:#D97706;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#071030;--ink:#EAF0FF;--mut:#A9B8E8;--card:#0E1B4A;--acc:#6C97FF;--onacc:#06113A;--accbg:#16296B;--accink:#CFE0FF;--line:#223272;--badbg:#4A1F18;--badink:#F8BBA9;--mind:#FBBF24;color-scheme:dark}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100%;box-sizing:border-box;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px;color:var(--ink)}.logo b{color:var(--mind)}
.small{font-size:14px;color:var(--mut);font-weight:600}

.card{background:var(--card);border-radius:16px;padding:16px 18px}
.card h2{margin:0 0 8px;font-size:15px;color:var(--acc)}
.card ul{margin:0;padding-left:20px;line-height:1.6}
.chip{align-self:flex-start;background:var(--accbg);color:var(--accink);font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px}
button{min-height:56px;border:0;border-radius:16px;background:var(--gold);color:var(--ongold);font:700 17px system-ui,sans-serif;padding:0 18px;cursor:pointer}
button.alt{background:transparent;color:var(--acc);border:2px solid var(--acc)}

button[disabled]{opacity:.45}
.opt{text-align:left;min-height:52px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px}

.opt.bad{background:var(--badbg);border-color:var(--badink);color:var(--badink)}
.hist{text-align:left;background:var(--card);color:var(--ink);border-radius:14px;min-height:52px}
input[type=password],input[type=text],input[type=date]{height:56px;box-sizing:border-box;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0 14px;font:600 16px system-ui,sans-serif}
.bar{height:8px;border-radius:4px;background:var(--line)}.bar i{display:block;height:8px;border-radius:4px;background:var(--acc)}
.stack{display:flex;flex-direction:column;gap:10px}.grow{flex:1}

.paper,.paper *{color:#111}.paper{background:#fff;border-radius:6px;padding:22px 20px;box-shadow:0 2px 14px rgba(0,0,0,.3);font-family:Georgia,serif;line-height:1.6}
.cd{background:var(--card);border-radius:16px;padding:14px 16px;text-align:right;word-break:break-all}

.ck.op{background:var(--accbg);color:var(--accink)}.ck.cl{background:var(--badbg);color:var(--badink)}.ck.eq{background:var(--gold);color:var(--ongold);border:0}

<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
// Clé Gemini : laisse vide, tu la saisis dans Réglages (reste sur ton téléphone).
const KEY_IN_CODE=(window.EDUMIND_KEY||"").trim();
const MODELS=["gemini-3.8-flash","gemini-3.6-flash","gemini-2.5-flash"];
const NAME='Abdoul BANDÉ',FIRST='Abdoul';
const COL={'Maths':'#2457C5','Physique-Chimie':'#7B3FC4','Français':'#B8266F','SVT':'#1B6B45','Histoire-Géo':'#C2570C','Anglais':'#0E7C86'};
const SUBJ=['Maths','Physique-Chimie','Français','SVT','Histoire-Géo','Anglais'];
const app=document.getElementById('app');
const store={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let D=Object.assign({key:store.get('edumind_key',''),date:'',results:[],errors:[],hist:[],fiches:[],days:{},devoirs:[],act:[]},store.get('eduv2',{}));
const save=()=>store.set('eduv2',D);
D.hist.forEach(x=>{if(!x.id)x.id=uid()});
const getKey=()=>D.key||KEY_IN_CODE;
const today=()=>new Date().toISOString().slice(0,10);
let S={v:'home',err:'',lesson:null,qs:[],i:0,picked:null,good:0,bad:[],mode:'lesson',subj:'',next:'',t0:0},installEvt=null,tick=null;
function h(t,a,...k){const e=document.createElement(t);for(const n in(a||{})){if(a[n]==null)continue;if(n==='class')e.className=a[n];else if(n==='on')for(const ev in a.on)e.addEventListener(ev,a.on[ev]);else e.setAttribute(n,a[n])}for(const c of k.flat())if(c!=null)e.append(c);return e}
const hdr=(r)=>h('div',{class:'top'},h('span',{class:'logo'},h('img',{src:'icon-192.png',alt:'',width:'34',height:'34',style:'border-radius:9px;vertical-align:middle;margin-right:8px'}),'Edu',h('b',{},'Mind')),h('span',{class:'small'},r||''));
const p2=t=>h('p',{},t);
function fmt(t){t=mf(t);const out=[];const L=t.split('\n');L.forEach((ln,i)=>{if(/^\s*(-{3,}|\*{3,})\s*$/.test(ln))return;const hd=/^\s*#{1,6}\s+/.test(ln);ln=ln.replace(/^\s*#{1,6}\s+/,'').replace(/^\s*[*-]\s+/,'• ');const nodes=ln.split('**').map((p,j)=>j%2?h('strong',{},p):p);if(hd)out.push(h('strong',{},nodes));else out.push(...nodes);if(i<L.length-1)out.push('\n')});return out}
function go(v,x){try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}Object.assign(S,x||{},{v});render()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

function daysLeft(){if(!D.date)return null;return Math.ceil((new Date(D.date)-new Date(today()))/864e5)}
function streak(){let n=0,d=new Date();if(!D.days[today()])d.setDate(d.getDate()-1);while(D.days[d.toISOString().slice(0,10)]){n++;d.setDate(d.getDate()-1)}return n}

async function shrink(file){
  const url=URL.createObjectURL(file),img=new Image();
  await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src=url});
  const r=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',0.82).split(',')[1];
}
const FORMAT=`Réponds UNIQUEMENT en JSON, sans texte autour. Chaque question : {"q":"","choix":["","","",""],"reponse":0,"explication":"une phrase"} où "reponse" est l’index du bon choix (une question peut être vrai/faux avec 2 choix). Français simple, réponses vérifiables et correctes. Écris les formules en texte simple (x², √, ×, ÷), jamais de $ ni de LaTeX.`;
function gcfg(m,json,max){const c={};if(json)c.responseMimeType='application/json';if(max)c.maxOutputTokens=max;if(/gemini-3/.test(m))c.thinkingConfig={thinkingLevel:'low'};else if(/2\.5/.test(m))c.thinkingConfig={thinkingBudget:0};return c}
async function modelList(key){
  if(D.mlist&&Date.now()-(D.mt||0)<864e5)return D.mlist;
  try{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(key),{signal:ctl.signal});clearTimeout(to);
    const j=await r.json();
    const ns=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/','')).filter(n=>/^gemini-[0-9.]+-flash/.test(n)&&!/image|tts|live|audio|embed|robotics|computer|deep|custom|exp|thinking/.test(n));
    const ver=n=>parseFloat((n.match(/gemini-([0-9.]+)/)||[0,0])[1]);
    ns.sort((x,y)=>(/preview/.test(x)-/preview/.test(y))||(/lite/.test(y)-/lite/.test(x))||(ver(y)-ver(x)));
    if(ns.length){D.mlist=ns.slice(0,6);D.mt=Date.now();save();return D.mlist}
  }catch(e){}
  return [];
}
async function callGemini(text,imgs,json=true,max=0,tmo=30000){
  const key=getKey();let last='',slow=false;
  if(!D.key&&KEY_IN_CODE){D.use=D.use||{};const t0=today();if((D.use[t0]||0)>=30)throw new Error('Limite du jour atteinte (30 demandes sur cet appareil). Reviens demain, ou mets ta propre clé dans Réglages.');D.use[t0]=(D.use[t0]||0)+1;save()}
  const names=[...new Set([D.model,...await modelList(key),...MODELS].filter(Boolean))].slice(0,6);
  const parts=[{text}].concat((imgs||[]).map(d=>({inline_data:{mime_type:'image/jpeg',data:d}})));
  for(const m of names){
    const send=async(c)=>{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),tmo);
      try{return await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(key),{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:c})})}finally{clearTimeout(to)}};
    let r;
    try{
      r=await send(gcfg(m,json,max));
      if(r.status===400){const j0=await r.clone().json().catch(()=>({}));if(/think/i.test((j0.error&&j0.error.message)||'')){const c=gcfg(m,json,max);delete c.thinkingConfig;r=await send(c)}}
    }catch(e){if(e.name==='AbortError'){slow=true;continue}throw e}
    if(r.status===429){last='Trop de demandes. Attends une minute puis réessaie.';continue}
    if(r.status===400||r.status===403){const j=await r.json().catch(()=>({}));const msg=(j.error&&j.error.message)||'';if(/api key|API_KEY|permission/i.test(msg))throw new Error('Clé IA refusée. Vérifie-la dans Réglages.');last='('+r.status+') '+msg;continue}
    if(!r.ok){last='Erreur '+r.status;continue}
    const j=await r.json(),t=((j.candidates||[])[0]||{}).content;
    const txt=(t&&t.parts?t.parts.map(x=>x.text||'').join(''):'').trim();
    if(!txt){last='Réponse vide de l’IA.';continue}
    let out=txt;
    if(json){try{out=JSON.parse(txt.replace(/```json|```/g,'').trim())}catch(e){last='Réponse illisible de l’IA. Réessaie.';continue}}
    D.model=m;save();return out;
  }
  throw new Error(last||(slow?'L’IA met trop de temps à répondre. Réessaie dans un instant.':'Le service IA ne répond pas. Réessaie.'));
}
const bad=e=>go('home',{err:e instanceof TypeError?'Pas de connexion. Vérifie internet puis réessaie.':e.message||'Une erreur est survenue.'});
async function analyse(files){
  go('load',{err:''});
  try{
    const imgs=await Promise.all(files.map(shrink));
    const r=await callGemini(`Tu es EduMind, assistant pour un élève de 3ème qui prépare le BEPC (Afrique francophone). Matière : ${S.subj}. Les photos montrent une leçon du cahier. Lis uniquement ce qui est visible, sans inventer. Format : {"titre":"","resume":["5 à 8 phrases courtes : notions clés, définitions, formules, méthodes"],"fiche":[{"t":"nom court","v":"formule, date ou définition exacte à apprendre par cœur"}] (4 à 10 éléments),"questions":[6 questions variées de niveau BEPC]}. Écris les formules en texte simple, sans LaTeX. ${FORMAT} Si illisible : {"erreur":"explication courte pour reprendre la photo"}.`,imgs,true,0,45000);
    if(!r||r.erreur||!Array.isArray(r.questions)||!r.questions.length)throw new Error(r&&r.erreur||'Je n’ai pas réussi à lire cette leçon. Reprends la photo, bien droite et bien éclairée.');
    r.matiere=S.subj;(r.fiche||[]).forEach(f=>{if(f&&f.t&&f.v&&!D.fiches.some(x=>x.m===S.subj&&x.t===f.t))D.fiches.push({m:S.subj,t:String(f.t),v:String(f.v)})});const lid=uid();D.hist.unshift({id:lid,t:Date.now(),subj:S.subj,lesson:r});D.hist=D.hist.slice(0,100);logAct(S.subj);save();
    go('sum',{lesson:r,qs:r.questions,mode:'lesson',lid});
  }catch(e){bad(e)}
}
async function startExam(m){
  go('load',{err:'',subj:m});
  try{
    const r=await callGemini(`Génère 8 questions de niveau BEPC (classe de 3ème, programme francophone d’Afrique de l’Ouest) en ${m}, de difficulté variée, comme à l’examen. Format : {"questions":[...]}. ${FORMAT}`);
    if(!r||!Array.isArray(r.questions)||!r.questions.length)throw new Error('Impossible de créer le sujet. Réessaie.');
    startQuiz(r.questions,'exam',m);
  }catch(e){bad(e)}
}
function startQuiz(qs,mode,subj){go('quiz',{qs,mode,subj,i:0,picked:null,good:0,bad:[],t0:Date.now()})}
function answer(n){
  const q=S.qs[S.i];if(S.picked!==null)return;const ok=n===q.reponse;S.picked=n;ok?S.good++:S.bad.push(q);
  if(S.mode==='errors'){const e=D.errors.find(x=>x.q===q.q);if(e){if(ok){e.ok=(e.ok||0)+1;if(e.ok>=2)D.errors=D.errors.filter(x=>x!==e)}else e.ok=0}}
  else if(!ok&&S.mode!=='retry'&&!D.errors.some(x=>x.q===q.q))D.errors.push(Object.assign({},q,{m:S.subj,ok:0}));
  save();render();
}
function finish(){
  if(S.subj)logAct(S.subj);
  if(S.mode!=='retry')D.days[today()]=(D.days[today()]||0)+1;
  save();go('score');
}
function pick(){
  const mk=(cam,label,alt)=>{const inp=h('input',{type:'file',accept:'image/*',style:'display:none',on:{change:e=>{const f=[...e.target.files];if(f.length)analyse(f)}}});if(cam)inp.setAttribute('capture','environment');else inp.setAttribute('multiple','');return [inp,h('button',{class:alt?'alt':'',on:{click:()=>inp.click()}},label)]};
  return h('div',{class:'stack'},mk(true,'Prendre une photo',false),mk(false,'Choisir des photos',true));
}

const bubble=(r,t)=>h('div',{style:'white-space:pre-wrap;padding:12px 14px;border-radius:14px;max-width:90%;'+(r==='u'?'align-self:flex-end;background:var(--accbg);color:var(--accink)':'align-self:flex-start;background:var(--card)')},r==='a'?fmt(t):t);
async function ask(inp,f,ph){
  const t=inp.value.trim(),file=f.files[0];if(!t&&!file)return;
  S.chat=S.chat||[];const box=document.getElementById('msgs');if(!S.chat.length)box.replaceChildren();
  const shown=t||'(photo)';S.chat.push({r:'u',t:shown});box.append(bubble('u',shown));
  const wait=bubble('a','Le prof réfléchit…');box.append(wait);box.scrollTop=box.scrollHeight;inp.value='';ph.textContent='Photo';
  try{
    const img=file?[await shrink(file)]:[];f.value='';
    const hist=S.chat.slice(-9,-1).map(m=>(m.r==='u'?'Élève : ':'Prof : ')+m.t).join('\n');
    const a=await callGemini(`Tu es un professeur patient et bienveillant pour un élève de 3ème qui prépare le BEPC (Afrique francophone). Réponds de façon courte et adaptée à la question : si l’élève salue, salue-le et demande sur quelle matière ou quel exercice il veut travailler. Quand il pose une vraie question, explique étape par étape, en français simple, avec un exemple. N’utilise aucun formatage Markdown (pas de ###, de ** ni de ---). Écris les formules en texte simple, sans LaTeX. Si tu n’es pas sûr, dis-le au lieu d’inventer. Termine par une courte question pour vérifier que l’élève a compris.\n${hist}\nÉlève : ${t||'Explique cet exercice.'}`,img,false,900,15000);
    wait.replaceChildren(...fmt(a));S.chat.push({r:'a',t:a});
  }catch(e){wait.textContent=e instanceof TypeError?'Pas de connexion.':e.message;S.chat.pop()}
  box.scrollTop=box.scrollHeight;
}
async function startExo(m,topic){
  go('load',{err:'',subj:m});
  try{
    const r=await callGemini(`Crée 3 exercices de niveau BEPC (3ème, programme francophone d’Afrique de l’Ouest) en ${m}${topic?', sur le chapitre : '+topic:''}. Pour chacun, une correction détaillée étape par étape, juste et vérifiée. Écris les formules en texte simple, sans LaTeX. Format JSON : {"exos":[{"enonce":"","correction":["étape 1","étape 2"]}]}`);
    if(!r||!Array.isArray(r.exos)||!r.exos.length)throw new Error('Impossible de créer les exercices. Réessaie.');
    go('exo',{exos:r.exos,ei:0,show:false});
  }catch(e){bad(e)}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','n':'ⁿ'},SUB='₀₁₂₃₄₅₆₇₈₉';
function mf(t){t=String(t==null?'':t);
  t=t.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,'($1)/($2)').replace(/\\sqrt\s*\{([^{}]*)\}/g,'√($1)').replace(/\\times/g,'×').replace(/\\div/g,'÷').replace(/\\cdot/g,'·').replace(/\\pi/g,'π').replace(/\\leq?(?![a-z])/g,'≤').replace(/\\geq?(?![a-z])/g,'≥').replace(/\\neq/g,'≠').replace(/\\circ/g,'°').replace(/\\(?:left|right)/g,'').replace(/\\[,;! ]/g,' ').replace(/\\text\s*\{([^{}]*)\}/g,'$1');
  t=t.replace(/\^\{([0-9n+\-]+)\}/g,(m,a)=>[...a].map(c=>SUP[c]||c).join('')).replace(/\^(-?[0-9]+|n)/g,(m,a)=>[...a].map(c=>SUP[c]||c).join('')).replace(/_\{?([0-9]+)\}?/g,(m,a)=>[...a].map(c=>SUB[+c]).join(''));
  return t.replace(/\$/g,'')}
function logAct(m){if(!m)return;D.act.push({m,t:Date.now()});D.act=D.act.slice(-200)}
function lastAct(m){let t=0;D.act.forEach(x=>{if(x.m===m&&x.t>t)t=x.t});D.hist.forEach(x=>{if(x.subj===m&&x.t>t)t=x.t});return t}
function leastWorked(){return SUBJ.slice().sort((a,b)=>lastAct(a)-lastAct(b))[0]}
function speakBtn(L){
  const b=h('button',{class:'alt'},'🔊 Lire à voix haute');
  if(!('speechSynthesis' in window)){b.disabled=true;b.textContent='Lecture à voix haute non disponible';return b}
  let on=false;
  b.addEventListener('click',()=>{
    if(on){speechSynthesis.cancel();on=false;b.textContent='🔊 Lire à voix haute';return}
    const parts=[L.titre||'',...(L.resume||[]),...(L.fiche||[]).map(f=>f.t+' : '+f.v)].map(x=>mf(x).replace(/[*#]/g,'')).filter(Boolean);
    speechSynthesis.cancel();on=true;b.textContent='⏹ Arrêter la lecture';
    parts.forEach((x,i)=>{const u=new SpeechSynthesisUtterance(x);u.lang='fr-FR';u.rate=0.95;if(i===parts.length-1)u.onend=()=>{on=false;b.textContent='🔊 Lire à voix haute'};speechSynthesis.speak(u)});
  });return b}
function delLesson(){
  if(!S.lid||!D.hist.some(x=>x.id===S.lid))return null;
  const b=h('button',{class:'link',style:'color:var(--badink)'},'Supprimer cette leçon');let armed=false;
  b.addEventListener('click',()=>{if(!armed){armed=true;b.textContent='Appuie encore pour confirmer';setTimeout(()=>{armed=false;b.textContent='Supprimer cette leçon'},4000)}else{D.hist=D.hist.filter(x=>x.id!==S.lid);save();go('lessons')}});return b}
async function makeDevoir(ids){
  const ls=(ids||[]).map(id=>D.hist.find(x=>x.id===id)).filter(Boolean);
  if(!ls.length)return bad(new Error('Choisis au moins une leçon.'));
  if(!getKey())return bad(new Error('Ajoute d’abord ta clé IA dans Réglages.'));
  const subj=ls[0].subj;go('load',{err:'',subj});

      h('div',{class:'grow'}),speakBtn(L),h('button',{on:{click:()=>startQuiz(L.questions,'lesson',S.subj||L.matiere)}},'Passer au questionnaire'),h('button',{class:'alt',on:{click:()=>makeDevoir([S.lid])}},'📝 Créer un devoir'),delLesson(),h('button',{class:'link',on:{click:()=>go(S.lid&&D.hist.some(x=>x.id===S.lid)?'lessons':'home')}},'Retour'));
  }
  if(S.v==='quiz'){
    const q=S.qs[S.i],done=S.picked!==null,lab=h('span',{},'Question '+(S.i+1)+' sur '+S.qs.length);
    if(S.mode==='exam'){lab.append(' · ',h('span',{id:'tm'},'0:00'));tick=setInterval(()=>{const e=document.getElementById('tm');if(e){const s=Math.floor((Date.now()-S.t0)/1000);e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},1000)}
    app.append(hdr(lab),h('div',{class:'bar'},h('i',{style:'width:'+(S.i/S.qs.length*100)+'%'})),h('h1',{style:'font-size:24px'},mf(q.q)),
      h('div',{class:'stack'},q.choix.map((c,n)=>h('button',{class:'opt'+(done?(n===q.reponse?' ok':n===S.picked?' bad':''):''),on:{click:()=>answer(n)}},mf(c)))));
    if(done)app.append(h('div',{class:'card'},h('strong',{},S.picked===q.reponse?'Bonne réponse ! ':'Pas tout à fait. '),fmt(q.explication||'')));
    app.append(h('div',{class:'grow'}));
    if(done)app.append(h('button',{on:{click:()=>S.i+1<S.qs.length?go('quiz',{i:S.i+1,picked:null}):finish()}},S.i+1<S.qs.length?'Question suivante':'Voir mon score'));
  }
  if(S.v==='score'){
    const n=S.qs.length,note=(S.good/n*20).toFixed(1).replace('.0',''),sec=Math.floor((Date.now()-S.t0)/1000);
    app.append(hdr('Terminé'),h('h1',{style:'text-align:center'},S.bad.length?'Bien joué !':'Parfait !'),h('div',{class:'score'},S.good+' / '+n),
      p2(S.good+' bonne(s) réponse(s) sur '+n+(S.mode==='exam'?' · '+Math.floor(sec/60)+' min '+sec%60+' s':'')),
      p2(S.bad.length?S.bad.length+' question(s) ajoutée(s) à ton cahier d’erreurs.':'Tout est réussi.'),h('div',{class:'grow'}));
    if(S.bad.length&&S.mode!=='retry')app.append(h('button',{on:{click:()=>startQuiz(S.bad,'retry',S.subj)}},'Refaire les questions ratées'));
    app.append(h('button',{class:'alt',on:{click:()=>go('home')}},'Accueil'));
  }
}
render();
</script>
